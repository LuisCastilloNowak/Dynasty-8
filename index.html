      /* Custom transitions */
      .page-transition-enter {
        opacity: 0;

      }
      @keyframes slow-zoom {
        from { transform: scale(1); }
        to { transform: scale(1.1); }
      }
      .animate-slow-zoom {
        animation: slow-zoom 20s infinite alternate linear;
      }
